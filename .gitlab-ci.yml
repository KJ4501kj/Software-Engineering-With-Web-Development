# .gitlab-ci.yml
# This pipeline is already configured to support the new Cypress location.

variables:
  GIT_SUBMODULE_STRATEGY: recursive

stages:
  - install
  - test
  - build_push
  - e2e_test

# --- STAGE: INSTALL ----
install_frontend_deps:
  stage: install
  image: node:18
  script:
    - cd web-frontend
    - npm install
  cache:
    key:
      files:
        - web-frontend/package-lock.json
    paths:
      - web-frontend/node_modules/
    policy: pull-push

# --- STAGE: TEST ----
run_frontend_tests:
  stage: test
  image: node:18
  script:
    - cd web-frontend
    - npm test
  needs:
    - job: install_frontend_deps

run_backend_tests:
  stage: test
  image: python:3.9-slim
  before_script:
    - cd web-backend
    - pip install -r requirements.txt
  script:
    - pytest

# --- STAGE: BUILD & PUSH ----
build_and_push_images:
  stage: build_push
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building frontend image..."
    - docker build -t $CI_REGISTRY_IMAGE/frontend:latest -f web-frontend/Dockerfile ./web-frontend

    - echo "Building web-backend image..."
    - docker build -t $CI_REGISTRY_IMAGE/web-backend:latest -f web-backend/Dockerfile ./web-backend

    - echo "Building model-backend image..."
    - docker build -t $CI_REGISTRY_IMAGE/model-backend:latest -f model-backend/Dockerfile ./model-backend
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# --- STAGE: END-TO-END TEST ----
run_e2e_tests:
  stage: e2e_test
  image: cypress/base:18
  script:
    # This script is already correct. It changes into the web-frontend directory,
    # installs dependencies, and then runs Cypress. Cypress will find
    # the config and tests in their new location within this directory.
    - cd web-frontend
    - npm ci
    - npm run cypress:run
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'